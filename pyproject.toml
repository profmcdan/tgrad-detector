[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgrad-detector"
version = "1.0.0"
description = "T-GRAD: fraud detection on an augmented relational state (code and results)"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "torch==2.11.0",
    "torch-geometric==2.7.0",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "pandas==3.0.2",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "networkx==3.6.1",
    "psutil",
]

[tool.setuptools.packages.find]
where = ["src"]
